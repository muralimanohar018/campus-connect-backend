version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campus_connect_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campus_connect
    ports:
      - '5432:5432'
    volumes:
      - campus_connect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus_connect_api
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/campus_connect?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  campus_connect_pgdata:
